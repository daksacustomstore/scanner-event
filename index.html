<!DOCTYPE html>
<html>

<head>

  <base target="_top">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
  >

  <title>Check-in Event</title>

  <!-- QR SCANNER LIBRARY -->
  <script src="https://unpkg.com/html5-qrcode"></script>


  <style>

    * {
      box-sizing: border-box;
    }


    body {

      margin: 0;

      padding: 0;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      background:
        #f3f4f6;

      color: #222;

    }


    .container {

      width: 100%;

      max-width: 520px;

      margin: auto;

      padding:
        18px;

    }


    /* ==============================
       HEADER
       ============================== */

    .header {

      text-align: center;

      margin-bottom: 18px;

    }


    .header h1 {

      margin:
        5px 0 6px;

      font-size: 27px;

      font-weight: 700;

    }


    .header p {

      margin: 0;

      font-size: 15px;

      color: #666;

    }


    /* ==============================
       START BUTTON
       ============================== */

    #startButton {

      display: block;

      width: 100%;

      padding:
        18px 15px;

      border: none;

      border-radius: 14px;

      background:
        #1a73e8;

      color: white;

      font-size: 19px;

      font-weight: bold;

      cursor: pointer;

      box-shadow:
        0 4px 10px
        rgba(0,0,0,0.12);

    }


    #startButton:active {

      transform:
        scale(0.98);

    }


    /* ==============================
       CAMERA
       ============================== */

    #reader {

      display: none;

      width: 100%;

      background: #000;

      border-radius: 16px;

      overflow: hidden;

      margin-top: 15px;

    }


    /* ==============================
       RESULT
       ============================== */

    .result {

      display: none;

      margin-top: 18px;

      padding:
        25px 18px;

      border-radius: 16px;

      background: white;

      text-align: center;

      box-shadow:
        0 3px 12px
        rgba(0,0,0,0.08);

    }


    .result-icon {

      font-size: 55px;

      line-height: 1;

      margin-bottom: 12px;

    }


    .result-title {

      font-size: 25px;

      font-weight: bold;

      margin-bottom: 12px;

    }


    .result-name {

      font-size: 25px;

      font-weight: bold;

      margin:
        10px 0;

    }


    .result-info {

      font-size: 16px;

      color: #555;

      line-height: 1.6;

    }


    .result-code {

      margin-top: 12px;

      font-size: 17px;

      font-weight: bold;

    }


    /* ==============================
       COLORS
       ============================== */

    .success {

      border-top:
        7px solid #16803c;

    }


    .success .result-title {

      color:
        #16803c;

    }


    .warning {

      border-top:
        7px solid #d88900;

    }


    .warning .result-title {

      color:
        #b26a00;

    }


    .error {

      border-top:
        7px solid #d93025;

    }


    .error .result-title {

      color:
        #d93025;

    }


    /* ==============================
       NEXT SCAN BUTTON
       ============================== */

    #scanAgain {

      display: none;

      width: 100%;

      margin-top: 15px;

      padding:
        17px 15px;

      border: none;

      border-radius: 14px;

      background:
        #111827;

      color: white;

      font-size: 17px;

      font-weight: bold;

      cursor: pointer;

    }


    #scanAgain:active {

      transform:
        scale(0.98);

    }


    /* ==============================
       INFO
       ============================== */

    .info {

      margin-top: 18px;

      padding: 16px;

      background: white;

      border-radius: 14px;

      text-align: center;

      color: #666;

      font-size: 14px;

      line-height: 1.5;

    }


    /* ==============================
       LOADING
       ============================== */

    .loading {

      display: none;

      text-align: center;

      margin-top: 15px;

      color: #666;

      font-size: 15px;

    }


  </style>

</head>


<body>


<div class="container">


  <!-- =========================================
       HEADER
       ========================================= -->

  <div class="header">

    <h1>
      CHECK-IN EVENT
    </h1>

    <p>
      Scan QR Code Peserta
    </p>

  </div>


  <!-- =========================================
       START BUTTON
       ========================================= -->

  <button
    id="startButton"
    onclick="startScanner()"
  >

    📷 MULAI SCANNER

  </button>


  <!-- =========================================
       LOADING
       ========================================= -->

  <div
    id="loading"
    class="loading"
  >

    Membuka kamera...

  </div>


  <!-- =========================================
       QR CAMERA
       ========================================= -->

  <div id="reader"></div>


  <!-- =========================================
       RESULT
       ========================================= -->

  <div
    id="result"
    class="result"
  >

    <div
      id="resultIcon"
      class="result-icon"
    ></div>


    <div
      id="resultTitle"
      class="result-title"
    ></div>


    <div
      id="resultName"
      class="result-name"
    ></div>


    <div
      id="resultInfo"
      class="result-info"
    ></div>


    <div
      id="resultCode"
      class="result-code"
    ></div>

  </div>


  <!-- =========================================
       NEXT SCAN
       ========================================= -->

  <button
    id="scanAgain"
    onclick="scanAgain()"
  >

    📷 SCAN PESERTA BERIKUTNYA

  </button>


  <!-- =========================================
       INFO
       ========================================= -->

  <div
    id="info"
    class="info"
  >

    Tekan tombol
    <b>MULAI SCANNER</b>
    untuk mengaktifkan kamera.

  </div>


</div>


<script>

// =====================================================
// KONFIGURASI
// =====================================================

// URL Web App Google Apps Script yang menjadi database check-in.
const GOOGLE_SCRIPT_URL =
  'https://script.google.com/macros/s/AKfycbwpZRPTpi74hlQP48SqOEs1mScsH_C_5njMGSGTXJttEcOYxPN_8FkHnC700sWkC-eM/exec';


// =====================================================
// GLOBAL
// =====================================================

let scanner = null;
let scanning = false;
let processing = false;


// =====================================================
// BUNYI BEEP
// =====================================================

function beep() {

  try {
    const AudioContext =
      window.AudioContext ||
      window.webkitAudioContext;

    if (!AudioContext) return;

    const audioContext = new AudioContext();
    const oscillator = audioContext.createOscillator();
    const gainNode = audioContext.createGain();

    oscillator.type = 'sine';
    oscillator.frequency.value = 1000;
    gainNode.gain.value = 0.15;

    oscillator.connect(gainNode);
    gainNode.connect(audioContext.destination);

    oscillator.start();
    oscillator.stop(audioContext.currentTime + 0.15);

  } catch (error) {
    console.log('Beep tidak tersedia:', error);
  }
}


// =====================================================
// MINTA IZIN KAMERA
// =====================================================

async function requestCameraPermission() {

  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    throw new Error(
      'Browser tidak mendukung akses kamera. Gunakan Chrome atau browser modern melalui HTTPS.'
    );
  }

  // Memanggil getUserMedia secara langsung agar browser menampilkan
  // popup izin kamera pada kunjungan pertama.
  const stream = await navigator.mediaDevices.getUserMedia({
    video: {
      facingMode: { ideal: 'environment' }
    },
    audio: false
  });

  // Stream ini hanya untuk meminta izin. Html5Qrcode akan membuka
  // kamera kembali saat proses scanning dimulai.
  stream.getTracks().forEach(function(track) {
    track.stop();
  });

  // Beri waktu kamera menutup sebelum dibuka oleh Html5Qrcode.
  await new Promise(function(resolve) {
    setTimeout(resolve, 300);
  });
}


// =====================================================
// CARI KAMERA BELAKANG
// =====================================================

async function getBestCameraId() {

  const cameras = await Html5Qrcode.getCameras();

  if (!cameras || cameras.length === 0) {
    throw new Error('Kamera tidak ditemukan pada perangkat ini.');
  }

  // Prioritaskan kamera belakang.
  const keywords = [
    'back',
    'rear',
    'environment',
    'belakang'
  ];

  for (let i = 0; i < cameras.length; i++) {
    const label = String(cameras[i].label || '').toLowerCase();

    for (let j = 0; j < keywords.length; j++) {
      if (label.includes(keywords[j])) {
        return cameras[i].id;
      }
    }
  }

  // Jika nama kamera tidak jelas, gunakan kamera pertama.
  return cameras[0].id;
}


// =====================================================
// MULAI SCANNER
// =====================================================

async function startScanner() {

  if (scanning) return;

  processing = false;

  document.getElementById('result').style.display = 'none';
  document.getElementById('scanAgain').style.display = 'none';
  document.getElementById('startButton').style.display = 'none';
  document.getElementById('info').style.display = 'none';
  document.getElementById('loading').style.display = 'block';
  document.getElementById('loading').innerHTML = 'Meminta izin kamera...';
  document.getElementById('reader').style.display = 'block';

  try {

    // =================================================
    // 1. PAKSA BROWSER MEMINTA IZIN KAMERA
    // =================================================

    await requestCameraPermission();

    document.getElementById('loading').innerHTML =
      'Membuka kamera...';

    // =================================================
    // 2. BUAT SCANNER
    // =================================================

    if (scanner) {
      try {
        await scanner.clear();
      } catch (e) {
        console.log('Scanner lama tidak perlu dibersihkan:', e);
      }
    }

    scanner = new Html5Qrcode('reader');

    // =================================================
    // 3. PILIH KAMERA BELAKANG
    // =================================================

    const cameraId = await getBestCameraId();

    // =================================================
    // 4. START SCANNER
    // =================================================

    await scanner.start(
      cameraId,
      {
        fps: 10,
        qrbox: {
          width: 250,
          height: 250
        },
        aspectRatio: 1.0
      },
      onScanSuccess,
      function(errorMessage) {
        // Error scan biasa tidak perlu ditampilkan.
      }
    );

    scanning = true;

    document.getElementById('loading').style.display = 'none';

  } catch (error) {

    console.error('Gagal membuka kamera:', error);

    scanning = false;

    document.getElementById('loading').style.display = 'none';
    document.getElementById('reader').style.display = 'none';
    document.getElementById('startButton').style.display = 'block';

    let message = String(error && error.message ? error.message : error);

    if (
      message.toLowerCase().includes('permission') ||
      message.toLowerCase().includes('notallowed') ||
      message.toLowerCase().includes('denied')
    ) {
      message =
        'Izin kamera ditolak oleh browser.<br><br>' +
        'Silakan pilih <b>IZINKAN</b> ketika popup kamera muncul. ' +
        'Jika sebelumnya memilih <b>Jangan izinkan</b>, izin kamera perlu diaktifkan kembali pada pengaturan situs browser.';
    }

    showError(
      'KAMERA TIDAK DAPAT DIBUKA',
      message
    );
  }
}


// =====================================================
// QR BERHASIL DIBACA
// =====================================================

async function onScanSuccess(decodedText) {

  if (!scanning || processing) return;

  processing = true;
  beep();

  // =================================================
  // STOP CAMERA
  // =================================================

  try {
    if (scanner) {
      await scanner.stop();
    }
  } catch (error) {
    console.log('Kamera sudah berhenti:', error);
  }

  scanning = false;

  document.getElementById('reader').style.display = 'none';
  document.getElementById('loading').style.display = 'block';
  document.getElementById('loading').innerHTML = 'Memeriksa peserta...';

  // =================================================
  // KIRIM QR KE GOOGLE APPS SCRIPT MENGGUNAKAN JSONP
  // =================================================

  checkQRCodeFromServer(decodedText)
    .then(function(data) {

      document.getElementById('loading').style.display = 'none';
      showResult(data);

    })
    .catch(function(error) {

      document.getElementById('loading').style.display = 'none';

      showError(
        'GAGAL TERHUBUNG',
        'Tidak dapat menghubungi server. Periksa koneksi internet.<br><br>' +
        '<small>' + escapeHtml(String(error)) + '</small>'
      );

    });
}


// =====================================================
// HUBUNGI GOOGLE APPS SCRIPT
// JSONP, BUKAN google.script.run
// =====================================================

function checkQRCodeFromServer(qrText) {

  return new Promise(function(resolve, reject) {

    const callbackName =
      'qrCallback_' +
      Date.now() + '_' +
      Math.floor(Math.random() * 100000);

    const script = document.createElement('script');

    let finished = false;

    const timeout = setTimeout(function() {

      if (finished) return;

      finished = true;
      cleanup();

      reject(
        new Error(
          'Server tidak memberikan respons dalam waktu yang ditentukan.'
        )
      );

    }, 15000);


    function cleanup() {
      clearTimeout(timeout);

      try {
        delete window[callbackName];
      } catch (e) {
        window[callbackName] = undefined;
      }

      if (script.parentNode) {
        script.parentNode.removeChild(script);
      }
    }


    window[callbackName] = function(data) {

      if (finished) return;

      finished = true;
      cleanup();
      resolve(data);
    };


    script.onerror = function() {

      if (finished) return;

      finished = true;
      cleanup();

      reject(
        new Error(
          'Gagal mengakses Google Apps Script.'
        )
      );
    };


    script.src =
      GOOGLE_SCRIPT_URL +
      '?action=check' +
      '&qr=' +
      encodeURIComponent(qrText) +
      '&callback=' +
      encodeURIComponent(callbackName) +
      '&_=' +
      Date.now();


    document.body.appendChild(script);
  });
}


// =====================================================
// TAMPILKAN HASIL
// =====================================================

function showResult(data) {

  const result = document.getElementById('result');
  const icon = document.getElementById('resultIcon');
  const title = document.getElementById('resultTitle');
  const name = document.getElementById('resultName');
  const info = document.getElementById('resultInfo');
  const code = document.getElementById('resultCode');

  result.style.display = 'block';

  // =================================================
  // HADIR
  // =================================================

  if (data.status === 'HADIR') {

    result.className = 'result success';
    icon.innerHTML = '✅';
    title.innerHTML = 'CHECK-IN BERHASIL';
    name.innerHTML = escapeHtml(data.nama || '');
    info.innerHTML =
      escapeHtml(data.jabatan || '') +
      '<br>' +
      escapeHtml(data.waktu || '');
    code.innerHTML =
      'Kode Peserta: ' +
      escapeHtml(data.kode || '');

  }

  // =================================================
  // SUDAH HADIR
  // =================================================

  else if (data.status === 'SUDAH_HADIR') {

    result.className = 'result warning';
    icon.innerHTML = '⚠️';
    title.innerHTML = 'SUDAH CHECK-IN';
    name.innerHTML = escapeHtml(data.nama || '');
    info.innerHTML =
      escapeHtml(data.jabatan || '') +
      '<br>Check-in: ' +
      escapeHtml(data.waktu || '');
    code.innerHTML =
      'Kode Peserta: ' +
      escapeHtml(data.kode || '');

  }

  // =================================================
  // ERROR
  // =================================================

  else {

    showError(
      'QR TIDAK VALID',
      escapeHtml(data.pesan || 'QR Code tidak valid.')
    );

    return;
  }

  document.getElementById('scanAgain').style.display = 'block';
}


// =====================================================
// ESCAPE HTML
// =====================================================

function escapeHtml(value) {

  return String(value == null ? '' : value)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');
}


// =====================================================
// ERROR
// =====================================================

function showError(titleText, messageText) {

  const result = document.getElementById('result');
  const icon = document.getElementById('resultIcon');
  const title = document.getElementById('resultTitle');
  const name = document.getElementById('resultName');
  const info = document.getElementById('resultInfo');
  const code = document.getElementById('resultCode');

  result.className = 'result error';
  result.style.display = 'block';

  icon.innerHTML = '❌';
  title.innerHTML = titleText;
  name.innerHTML = '';
  info.innerHTML = messageText;
  code.innerHTML = '';

  document.getElementById('scanAgain').style.display = 'block';
}


// =====================================================
// SCAN PESERTA BERIKUTNYA
// =====================================================

function scanAgain() {

  document.getElementById('result').style.display = 'none';
  document.getElementById('scanAgain').style.display = 'none';

  startScanner();
}


</script>

</body>

</html>
