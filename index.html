<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#111827">
  <meta name="description" content="Scanner Check-in Event">
  <title>Check-in Event</title>

  <!--
    ============================================================
    CHECK-IN EVENT
    ============================================================
    HALAMAN INI KHUSUS UNTUK GITHUB PAGES.

    Kamera TIDAK dijalankan dari Google Apps Script.
    Google Apps Script hanya dipakai sebagai API/database.

    Alur:
    GitHub Pages -> Kamera -> QR -> JSONP -> Apps Script -> Sheets
    ============================================================
  -->

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      background: #f3f4f6;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background: #f3f4f6;
      color: #111827;
      -webkit-text-size-adjust: 100%;
    }

    button {
      font: inherit;
      -webkit-tap-highlight-color: transparent;
    }

    .container {
      width: 100%;
      max-width: 760px;
      margin: 0 auto;
      padding: 28px 18px 40px;
    }

    .header {
      text-align: center;
      margin: 4px 0 24px;
    }

    .header h1 {
      margin: 0 0 8px;
      font-size: clamp(28px, 7vw, 42px);
      line-height: 1.1;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    .header p {
      margin: 0;
      color: #667085;
      font-size: clamp(17px, 4.5vw, 22px);
    }

    #startButton,
    #scanAgain {
      display: block;
      width: 100%;
      border: 0;
      border-radius: 16px;
      padding: 19px 16px;
      font-size: clamp(19px, 5vw, 26px);
      font-weight: 800;
      cursor: pointer;
      touch-action: manipulation;
    }

    #startButton {
      background: #287be5;
      color: #fff;
      box-shadow: 0 8px 18px rgba(17, 24, 39, 0.16);
    }

    #startButton:active,
    #scanAgain:active {
      transform: scale(0.985);
    }

    #startButton:disabled {
      opacity: 0.65;
      cursor: wait;
    }

    #reader {
      display: none;
      width: 100%;
      margin-top: 18px;
      overflow: hidden;
      border-radius: 16px;
      background: #000;
      box-shadow: 0 8px 20px rgba(17, 24, 39, 0.16);
    }

    #reader video {
      width: 100% !important;
      height: auto !important;
      display: block;
      border-radius: 16px;
    }

    #reader__dashboard_section_csr,
    #reader__dashboard_section_swaplink {
      color: #fff;
    }

    .loading {
      display: none;
      margin-top: 16px;
      padding: 15px;
      border-radius: 12px;
      text-align: center;
      background: #fff;
      color: #667085;
      font-size: 16px;
    }

    .result {
      display: none;
      margin-top: 18px;
      padding: 28px 20px;
      background: #fff;
      border-radius: 18px;
      text-align: center;
      box-shadow: 0 7px 18px rgba(17, 24, 39, 0.10);
    }

    .result.success {
      border-top: 7px solid #16803c;
    }

    .result.warning {
      border-top: 7px solid #d88900;
    }

    .result.error {
      border-top: 7px solid #d93025;
    }

    .result-icon {
      font-size: 62px;
      line-height: 1;
      margin-bottom: 16px;
    }

    .result-title {
      font-size: clamp(27px, 7vw, 40px);
      line-height: 1.15;
      font-weight: 800;
      margin-bottom: 12px;
    }

    .success .result-title {
      color: #16803c;
    }

    .warning .result-title {
      color: #b26a00;
    }

    .error .result-title {
      color: #d93025;
    }

    .result-name {
      font-size: clamp(23px, 6vw, 32px);
      font-weight: 800;
      color: #111827;
      margin-top: 8px;
    }

    .result-info {
      margin-top: 12px;
      font-size: clamp(17px, 4.5vw, 22px);
      line-height: 1.5;
      color: #374151;
      word-break: break-word;
    }

    .result-code {
      margin-top: 12px;
      font-size: 16px;
      color: #667085;
      word-break: break-word;
    }

    #scanAgain {
      display: none;
      margin-top: 16px;
      background: #111827;
      color: #fff;
    }

    .info {
      margin-top: 18px;
      padding: 16px;
      background: #fff;
      border-radius: 14px;
      text-align: center;
      color: #667085;
      font-size: 14px;
      line-height: 1.55;
    }

    .info b {
      color: #374151;
    }

    .status-dot {
      display: inline-block;
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #98a2b3;
      margin-right: 6px;
    }

    .status-dot.online {
      background: #16803c;
    }

    .status-dot.offline {
      background: #d93025;
    }

    .camera-help {
      display: none;
      margin-top: 16px;
      padding: 18px;
      border-radius: 14px;
      background: #fff;
      color: #374151;
      line-height: 1.55;
      font-size: 15px;
    }

    .camera-help strong {
      color: #d93025;
    }

    @media (max-width: 480px) {
      .container {
        padding: 24px 14px 30px;
      }

      .result {
        padding: 24px 16px;
      }
    }
  </style>
</head>

<body>
  <main class="container">

    <header class="header">
      <h1>CHECK-IN EVENT</h1>
      <p>Scan QR Code Peserta</p>
    </header>

    <button id="startButton" type="button">
      📷 MULAI SCANNER
    </button>

    <div id="loading" class="loading">
      Meminta izin kamera...
    </div>

    <div id="reader"></div>

    <section id="result" class="result" aria-live="polite">
      <div id="resultIcon" class="result-icon"></div>
      <div id="resultTitle" class="result-title"></div>
      <div id="resultName" class="result-name"></div>
      <div id="resultInfo" class="result-info"></div>
      <div id="resultCode" class="result-code"></div>
    </section>

    <button id="scanAgain" type="button">
      📷 SCAN PESERTA BERIKUTNYA
    </button>

    <div id="info" class="info">
      Tekan <b>MULAI SCANNER</b> untuk mengaktifkan kamera.
      <br>
      Scanner harus dibuka dari URL <b>HTTPS GitHub Pages</b>, bukan dari preview editor.
      <br><br>
      <span id="apiStatus">
        <span class="status-dot"></span> Menghubungkan ke server...
      </span>
    </div>

    <div id="cameraHelp" class="camera-help"></div>

  </main>

  <script>
    "use strict";

    // ============================================================
    // KONFIGURASI
    // ============================================================

    const GOOGLE_SCRIPT_URL =
      "https://script.google.com/macros/s/AKfycbwpZRPTpi74hlQP48SqOEs1mScsH_C_5njMGSGTXJttEcOYxPN_8FkHnC700sWkC-eM/exec";

    const JSONP_TIMEOUT_MS = 15000;

    // ============================================================
    // GLOBAL
    // ============================================================

    let scanner = null;
    let scanning = false;
    let processing = false;
    let cameraStream = null;
    let jsonpCounter = 0;

    const startButton = document.getElementById("startButton");
    const scanAgainButton = document.getElementById("scanAgain");
    const reader = document.getElementById("reader");
    const loading = document.getElementById("loading");
    const info = document.getElementById("info");
    const cameraHelp = document.getElementById("cameraHelp");
    const apiStatus = document.getElementById("apiStatus");

    // ============================================================
    // UTILITAS
    // ============================================================

    function setLoading(show, text) {
      loading.style.display = show ? "block" : "none";
      if (text) {
        loading.textContent = text;
      }
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function beep() {
      try {
        const AudioContext =
          window.AudioContext || window.webkitAudioContext;

        if (!AudioContext) return;

        const context = new AudioContext();
        const oscillator = context.createOscillator();
        const gain = context.createGain();

        oscillator.type = "sine";
        oscillator.frequency.value = 1000;
        gain.gain.value = 0.15;

        oscillator.connect(gain);
        gain.connect(context.destination);

        oscillator.start();
        oscillator.stop(context.currentTime + 0.15);

        setTimeout(() => {
          try {
            context.close();
          } catch (_) {}
        }, 300);
      } catch (_) {
        // Audio hanya fitur tambahan.
      }
    }

    function stopRawCameraStream() {
      if (!cameraStream) return;

      try {
        cameraStream.getTracks().forEach(track => track.stop());
      } catch (_) {}

      cameraStream = null;
    }

    // ============================================================
    // STATUS API
    // ============================================================

    function updateApiStatus(text, online) {
      apiStatus.innerHTML =
        '<span class="status-dot ' +
        (online ? "online" : "offline") +
        '"></span>' +
        escapeHtml(text);
    }

    function checkApi() {
      // Jangan gunakan fetch() ke Apps Script dari GitHub Pages.
      // ContentService tidak memberikan CORS untuk pola ini.
      // Gunakan JSONP, sama seperti saat proses check-in.
      checkQRCodeWithJsonp("__PING__", true)
        .then(data => {
          if (data && data.status === "OK") {
            updateApiStatus("Server check-in siap.", true);
          } else {
            updateApiStatus("Server merespons.", true);
          }
        })
        .catch(() => {
          updateApiStatus("Server akan dicek saat QR dipindai.", false);
        });
    }

    // ============================================================
    // REQUEST KAMERA
    // ============================================================

    async function requestCameraPermission() {
      if (!window.isSecureContext) {
        throw new Error(
          "Halaman scanner bukan HTTPS. Buka URL GitHub Pages yang diawali https://."
        );
      }

      if (!navigator.mediaDevices ||
          typeof navigator.mediaDevices.getUserMedia !== "function") {
        throw new Error(
          "Browser ini tidak menyediakan akses kamera melalui getUserMedia."
        );
      }

      // Ini sengaja dipanggil langsung setelah tombol diklik.
      // Dengan begitu browser menerima permintaan kamera dari user gesture.
      cameraStream = await navigator.mediaDevices.getUserMedia({
        video: {
          facingMode: {
            ideal: "environment"
          }
        },
        audio: false
      });

      // Permission sudah diberikan. Matikan stream sementara karena
      // Html5Qrcode akan membuka stream scanner-nya sendiri.
      stopRawCameraStream();

      // Setelah izin diberikan, label perangkat kamera biasanya sudah
      // tersedia. Kita pilih kamera belakang bila dapat dikenali.
      let cameraId = null;

      try {
        const devices =
          await navigator.mediaDevices.enumerateDevices();

        const cameras =
          devices.filter(device => device.kind === "videoinput");

        if (cameras.length) {
          const rearCamera =
            cameras.find(device => {
              const label =
                String(device.label || "").toLowerCase();

              return (
                label.includes("back") ||
                label.includes("rear") ||
                label.includes("environment") ||
                label.includes("belakang")
              );
            });

          cameraId =
            (rearCamera || cameras[cameras.length - 1]).deviceId;
        }
      } catch (_) {
        // Tidak fatal. Kita bisa memakai facingMode sebagai fallback.
      }

      return cameraId;
    }

    // ============================================================
    // MULAI SCANNER
    // ============================================================

    async function startScanner() {
      if (scanning) return;

      processing = false;
      cameraHelp.style.display = "none";

      startButton.disabled = true;
      startButton.style.display = "block";

      scanAgainButton.style.display = "none";
      info.style.display = "none";
      document.getElementById("result").style.display = "none";

      reader.style.display = "block";
      setLoading(true, "Meminta izin kamera...");

      try {
        if (typeof Html5Qrcode === "undefined") {
          throw new Error(
            "Library scanner QR belum berhasil dimuat. Pastikan internet aktif."
          );
        }

        const cameraId = await requestCameraPermission();

        scanner = new Html5Qrcode("reader");

        const cameraConfig = cameraId
          ? {
              deviceId: {
                exact: cameraId
              }
            }
          : {
              facingMode: {
                ideal: "environment"
              }
            };

        setLoading(true, "Membuka kamera...");

        await scanner.start(
          cameraConfig,
          {
            fps: 10,
            qrbox: function(viewfinderWidth, viewfinderHeight) {
              const size = Math.floor(
                Math.min(viewfinderWidth, viewfinderHeight) * 0.68
              );

              return {
                width: Math.max(180, Math.min(300, size)),
                height: Math.max(180, Math.min(300, size))
              };
            },
            aspectRatio: 1.0
          },
          onScanSuccess,
          function() {
            // QR belum terbaca. Tidak perlu menampilkan error
            // karena callback ini dipanggil berkali-kali.
          }
        );

        scanning = true;
        startButton.disabled = false;
        startButton.style.display = "none";
        setLoading(false);

      } catch (error) {
        scanning = false;
        startButton.disabled = false;
        startButton.style.display = "block";
        reader.style.display = "none";
        setLoading(false);

        const message = getCameraErrorMessage(error);

        showError(
          "KAMERA TIDAK DAPAT DIBUKA",
          message
        );
      }
    }

    // ============================================================
    // PESAN ERROR KAMERA
    // ============================================================

    function getCameraErrorMessage(error) {
      const name = error && error.name
        ? String(error.name)
        : "";

      const raw = error && error.message
        ? String(error.message)
        : String(error || "");

      if (name === "NotAllowedError") {
        return (
          "<b>Akses kamera ditolak oleh browser.</b><br><br>" +
          "Pastikan URL yang dibuka adalah URL GitHub Pages HTTPS " +
          "dan izin Kamera untuk situs tersebut adalah <b>Izinkan</b>.<br><br>" +
          "Jika halaman sedang dibuka melalui preview/editor, tutup preview " +
          "dan buka URL GitHub Pages secara langsung."
        );
      }

      if (name === "NotFoundError") {
        return (
          "<b>Kamera tidak ditemukan.</b><br><br>" +
          "Pastikan perangkat memiliki kamera dan kamera tidak sedang " +
          "dipakai aplikasi lain."
        );
      }

      if (name === "NotReadableError") {
        return (
          "<b>Kamera sedang digunakan aplikasi lain.</b><br><br>" +
          "Tutup aplikasi yang sedang menggunakan kamera, lalu coba lagi."
        );
      }

      if (name === "SecurityError") {
        return (
          "<b>Browser memblokir akses kamera karena keamanan halaman.</b><br><br>" +
          "Buka scanner melalui HTTPS GitHub Pages."
        );
      }

      return (
        "<b>Gagal membuka kamera.</b><br><br>" +
        escapeHtml(raw || "Kesalahan kamera tidak diketahui.") +
        "<br><br>" +
        "Pastikan scanner dibuka dari URL GitHub Pages HTTPS."
      );
    }

    // ============================================================
    // QR BERHASIL TERBACA
    // ============================================================

    async function onScanSuccess(decodedText) {
      if (!scanning || processing) {
        return;
      }

      processing = true;
      beep();

      await stopScanner();

      setLoading(true, "Memeriksa data peserta...");

      try {
        const data =
          await checkQRCodeWithJsonp(decodedText);

        setLoading(false);
        showResult(data);

      } catch (error) {
        setLoading(false);

        showError(
          "GAGAL TERHUBUNG",
          escapeHtml(
            error && error.message
              ? error.message
              : "Tidak dapat menghubungi server check-in."
          )
        );
      }
    }

    // ============================================================
    // STOP SCANNER
    // ============================================================

    async function stopScanner() {
      scanning = false;

      if (!scanner) {
        reader.style.display = "none";
        return;
      }

      try {
        await scanner.stop();
      } catch (_) {}

      try {
        await scanner.clear();
      } catch (_) {}

      scanner = null;
      reader.style.display = "none";
    }

    // ============================================================
    // JSONP KE GOOGLE APPS SCRIPT
    // ============================================================

    function checkQRCodeWithJsonp(qrText, pingOnly) {
      return new Promise((resolve, reject) => {
        // Apps Script ContentService secara resmi mendukung JSONP
        // melalui parameter prefix. Kita gunakan callback global yang
        // hanya hidup selama satu request.
        const callbackName =
          "qrCallback_" +
          Date.now() +
          "_" +
          (++jsonpCounter);

        const script = document.createElement("script");
        let timeoutId = null;
        let finished = false;

        const cleanup = () => {
          if (finished) return;
          finished = true;

          try {
            delete window[callbackName];
          } catch (_) {
            window[callbackName] = undefined;
          }

          if (script.parentNode) {
            script.parentNode.removeChild(script);
          }

          if (timeoutId) {
            clearTimeout(timeoutId);
          }
        };

        // WAJIB dipasang di window karena JavaScript dari
        // script.googleusercontent.com akan memanggilnya sebagai
        // fungsi global.
        window[callbackName] = function(data) {
          cleanup();
          resolve(data);
        };

        script.onerror = function() {
          cleanup();
          reject(
            new Error(
              "Google Apps Script tidak dapat diakses. " +
              "Pastikan deployment Web App masih aktif dan aksesnya \"Siapa saja\"."
            )
          );
        };

        timeoutId = setTimeout(() => {
          cleanup();
          reject(
            new Error(
              "Server tidak merespons dalam " +
              (JSONP_TIMEOUT_MS / 1000) +
              " detik. Pastikan deployment Apps Script sudah diperbarui."
            )
          );
        }, JSONP_TIMEOUT_MS);

        const params = new URLSearchParams();
        params.set("action", "check");
        params.set("qr", String(qrText ?? ""));
        // Gunakan nama parameter resmi JSONP dari dokumentasi Apps Script.
        params.set("prefix", callbackName);
        params.set("_", String(Date.now()));

        script.src = GOOGLE_SCRIPT_URL + "?" + params.toString();
        script.async = true;
        script.setAttribute("data-checkin-jsonp", "1");

        document.head.appendChild(script);
      });
    }

    // ============================================================
    // TAMPILKAN HASIL
    // ============================================================

    function showResult(data) {
      const result = document.getElementById("result");
      const icon = document.getElementById("resultIcon");
      const title = document.getElementById("resultTitle");
      const name = document.getElementById("resultName");
      const resultInfo = document.getElementById("resultInfo");
      const code = document.getElementById("resultCode");

      result.style.display = "block";

      if (!data || typeof data !== "object") {
        showError(
          "RESPON SERVER TIDAK VALID",
          "Server mengembalikan data yang tidak dikenali."
        );
        return;
      }

      if (data.status === "HADIR") {
        result.className = "result success";
        icon.textContent = "✅";
        title.textContent = "CHECK-IN BERHASIL";
        name.innerHTML = escapeHtml(data.nama || "");
        resultInfo.innerHTML =
          escapeHtml(data.jabatan || "") +
          "<br>" +
          escapeHtml(data.waktu || "");
        code.textContent =
          "Kode Peserta: " +
          String(data.kode || "");

      } else if (data.status === "SUDAH_HADIR") {
        result.className = "result warning";
        icon.textContent = "⚠️";
        title.textContent = "SUDAH CHECK-IN";
        name.innerHTML = escapeHtml(data.nama || "");
        resultInfo.innerHTML =
          escapeHtml(data.jabatan || "") +
          "<br>Check-in: " +
          escapeHtml(data.waktu || "");
        code.textContent =
          "Kode Peserta: " +
          String(data.kode || "");

      } else {
        showError(
          "QR TIDAK VALID",
          escapeHtml(data.pesan || "Data peserta tidak ditemukan.")
        );
        return;
      }

      scanAgainButton.style.display = "block";
      startButton.style.display = "none";
    }

    // ============================================================
    // ERROR UMUM
    // ============================================================

    function showError(titleText, messageText) {
      const result = document.getElementById("result");
      const icon = document.getElementById("resultIcon");
      const title = document.getElementById("resultTitle");
      const name = document.getElementById("resultName");
      const resultInfo = document.getElementById("resultInfo");
      const code = document.getElementById("resultCode");

      result.className = "result error";
      result.style.display = "block";

      icon.textContent = "❌";
      title.textContent = titleText;
      name.textContent = "";
      resultInfo.innerHTML = messageText;
      code.textContent = "";

      scanAgainButton.style.display = "block";
      startButton.style.display = "none";

      if (
        titleText === "KAMERA TIDAK DAPAT DIBUKA"
      ) {
        cameraHelp.innerHTML =
          "<strong>Penting:</strong><br>" +
          "Buka scanner melalui URL GitHub Pages HTTPS secara langsung. " +
          "Jangan menggunakan preview editor atau URL Google Apps Script " +
          "untuk membuka kamera.";
        cameraHelp.style.display = "block";
      }
    }

    // ============================================================
    // SCAN PESERTA BERIKUTNYA
    // ============================================================

    async function scanAgain() {
      await stopScanner();

      processing = false;

      document.getElementById("result").style.display = "none";
      scanAgainButton.style.display = "none";
      cameraHelp.style.display = "none";

      startButton.style.display = "block";
      startButton.disabled = false;
      info.style.display = "block";
      setLoading(false);
    }

    // ============================================================
    // EVENT
    // ============================================================

    startButton.addEventListener("click", startScanner);
    scanAgainButton.addEventListener("click", scanAgain);

    window.addEventListener("pagehide", () => {
      stopScanner();
      stopRawCameraStream();
    });

    window.addEventListener("beforeunload", () => {
      stopScanner();
      stopRawCameraStream();
    });

    // ============================================================
    // START
    // ============================================================

    checkApi();
  </script>
</body>
</html>
