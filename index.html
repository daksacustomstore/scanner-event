<!DOCTYPE html>
<html>

<head>

  
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
  >

  <title>Check-in Event</title>

  <!-- QR SCANNER LIBRARY -->
  <script src="https://unpkg.com/html5-qrcode"></script>


  <style>

    * {
      box-sizing: border-box;
    }


    body {

      margin: 0;

      padding: 0;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      background:
        #f3f4f6;

      color: #222;

    }


    .container {

      width: 100%;

      max-width: 520px;

      margin: auto;

      padding:
        18px;

    }


    /* ==============================
       HEADER
       ============================== */

    .header {

      text-align: center;

      margin-bottom: 18px;

    }


    .header h1 {

      margin:
        5px 0 6px;

      font-size: 27px;

      font-weight: 700;

    }


    .header p {

      margin: 0;

      font-size: 15px;

      color: #666;

    }


    /* ==============================
       START BUTTON
       ============================== */

    #startButton {

      display: block;

      width: 100%;

      padding:
        18px 15px;

      border: none;

      border-radius: 14px;

      background:
        #1a73e8;

      color: white;

      font-size: 19px;

      font-weight: bold;

      cursor: pointer;

      box-shadow:
        0 4px 10px
        rgba(0,0,0,0.12);

    }


    #startButton:active {

      transform:
        scale(0.98);

    }


    /* ==============================
       CAMERA
       ============================== */

    #reader {

      display: none;

      width: 100%;

      background: #000;

      border-radius: 16px;

      overflow: hidden;

      margin-top: 15px;

    }


    /* ==============================
       RESULT
       ============================== */

    .result {

      display: none;

      margin-top: 18px;

      padding:
        25px 18px;

      border-radius: 16px;

      background: white;

      text-align: center;

      box-shadow:
        0 3px 12px
        rgba(0,0,0,0.08);

    }


    .result-icon {

      font-size: 55px;

      line-height: 1;

      margin-bottom: 12px;

    }


    .result-title {

      font-size: 25px;

      font-weight: bold;

      margin-bottom: 12px;

    }


    .result-name {

      font-size: 25px;

      font-weight: bold;

      margin:
        10px 0;

    }


    .result-info {

      font-size: 16px;

      color: #555;

      line-height: 1.6;

    }


    .result-code {

      margin-top: 12px;

      font-size: 17px;

      font-weight: bold;

    }


    /* ==============================
       COLORS
       ============================== */

    .success {

      border-top:
        7px solid #16803c;

    }


    .success .result-title {

      color:
        #16803c;

    }


    .warning {

      border-top:
        7px solid #d88900;

    }


    .warning .result-title {

      color:
        #b26a00;

    }


    .error {

      border-top:
        7px solid #d93025;

    }


    .error .result-title {

      color:
        #d93025;

    }


    /* ==============================
       NEXT SCAN BUTTON
       ============================== */

    #scanAgain {

      display: none;

      width: 100%;

      margin-top: 15px;

      padding:
        17px 15px;

      border: none;

      border-radius: 14px;

      background:
        #111827;

      color: white;

      font-size: 17px;

      font-weight: bold;

      cursor: pointer;

    }


    #scanAgain:active {

      transform:
        scale(0.98);

    }


    /* ==============================
       INFO
       ============================== */

    .info {

      margin-top: 18px;

      padding: 16px;

      background: white;

      border-radius: 14px;

      text-align: center;

      color: #666;

      font-size: 14px;

      line-height: 1.5;

    }


    /* ==============================
       LOADING
       ============================== */

    .loading {

      display: none;

      text-align: center;

      margin-top: 15px;

      color: #666;

      font-size: 15px;

    }


  </style>

</head>


<body>


<div class="container">


  <!-- =========================================
       HEADER
       ========================================= -->

  <div class="header">

    <h1>
      CHECK-IN EVENT
    </h1>

    <p>
      Scan QR Code Peserta
    </p>

  </div>


  <!-- =========================================
       START BUTTON
       ========================================= -->

  <button
    id="startButton"
    onclick="startScanner()"
  >

    📷 MULAI SCANNER

  </button>


  <!-- =========================================
       LOADING
       ========================================= -->

  <div
    id="loading"
    class="loading"
  >

    Membuka kamera...

  </div>


  <!-- =========================================
       QR CAMERA
       ========================================= -->

  <div id="reader"></div>


  <!-- =========================================
       RESULT
       ========================================= -->

  <div
    id="result"
    class="result"
  >

    <div
      id="resultIcon"
      class="result-icon"
    ></div>


    <div
      id="resultTitle"
      class="result-title"
    ></div>


    <div
      id="resultName"
      class="result-name"
    ></div>


    <div
      id="resultInfo"
      class="result-info"
    ></div>


    <div
      id="resultCode"
      class="result-code"
    ></div>

  </div>


  <!-- =========================================
       NEXT SCAN
       ========================================= -->

  <button
    id="scanAgain"
    onclick="scanAgain()"
  >

    📷 SCAN PESERTA BERIKUTNYA

  </button>


  <!-- =========================================
       INFO
       ========================================= -->

  <div
    id="info"
    class="info"
  >

    Tekan tombol
    <b>MULAI SCANNER</b>
    untuk mengaktifkan kamera.

  </div>


</div>


<script>


  // =====================================================
  // GLOBAL
  // =====================================================

  // =====================================================
  // KONFIGURASI GOOGLE APPS SCRIPT
  // =====================================================
  // Endpoint Web App yang menerima action=check.
  // JSONP dipakai karena halaman scanner berjalan di GitHub Pages,
  // sehingga API internal Apps Script tidak tersedia di halaman ini.
  const GOOGLE_SCRIPT_URL =
    "https://script.google.com/macros/s/AKfycbwpZRPTpi74hlQP48SqOEs1mScsH_C_5njMGSGTXJttEcOYxPN_8FkHnC700sWkC-eM/exec";

  let scanner = null;

  let scanning = false;

  let processing = false;

  let jsonpScript = null;


  // =====================================================
  // BUNYI BEEP
  // =====================================================

  function beep() {

    try {

      const AudioContext =
        window.AudioContext ||
        window.webkitAudioContext;


      if (!AudioContext) {
        return;
      }


      const audioContext =
        new AudioContext();


      const oscillator =
        audioContext.createOscillator();


      const gainNode =
        audioContext.createGain();


      oscillator.type =
        "sine";


      oscillator.frequency.value =
        1000;


      gainNode.gain.value =
        0.15;


      oscillator.connect(
        gainNode
      );


      gainNode.connect(
        audioContext.destination
      );


      oscillator.start();


      oscillator.stop(
        audioContext.currentTime + 0.15
      );

    }

    catch (error) {

      console.log(
        "Beep tidak tersedia:",
        error
      );

    }

  }


  // =====================================================
  // MULAI SCANNER
  // =====================================================

  function startScanner() {


    if (scanning) {

      return;

    }


    processing = false;


    // sembunyikan hasil

    document
      .getElementById("result")
      .style.display = "none";


    document
      .getElementById("scanAgain")
      .style.display = "none";


    document
      .getElementById("startButton")
      .style.display = "none";


    document
      .getElementById("info")
      .style.display = "none";


    document
      .getElementById("loading")
      .style.display = "block";


    document
      .getElementById("reader")
      .style.display = "block";


    // =================================================
    // BUAT SCANNER
    // =================================================

    scanner =
      new Html5Qrcode(
        "reader"
      );


    // =================================================
    // START KAMERA
    // =================================================

    scanner
      .start(

        {
          facingMode:
            "environment"
        },

        {

          fps: 10,

          qrbox: {

            width: 250,

            height: 250

          },

          aspectRatio:
            1.0

        },

        onScanSuccess

      )

      .then(function() {


        scanning = true;


        document
          .getElementById("loading")
          .style.display = "none";


      })

      .catch(function(error) {


        scanning = false;


        document
          .getElementById("loading")
          .style.display = "none";


        document
          .getElementById("reader")
          .style.display = "none";


        document
          .getElementById("startButton")
          .style.display = "block";


        showError(

          "KAMERA TIDAK DAPAT DIBUKA",

          "Silakan tekan tombol " +
          "<b>MULAI SCANNER</b> " +
          "lagi dan pilih " +
          "<b>IZINKAN</b> " +
          "ketika browser meminta akses kamera.<br><br>" +

          "<small>" +
          error +
          "</small>"

        );

      });


  }


  // =====================================================
  // QR BERHASIL DIBACA
  // =====================================================

  function onScanSuccess(
    decodedText
  ) {


    if (!scanning) {

      return;

    }


    if (processing) {

      return;

    }


    processing = true;


    beep();


    // =================================================
    // STOP CAMERA
    // =================================================

    scanner
      .stop()

      .then(function() {


        scanning = false;


        document
          .getElementById("reader")
          .style.display = "none";


        document
          .getElementById("loading")
          .style.display = "block";


        // =================================================
        // KIRIM QR KE GOOGLE APPS SCRIPT
        // =================================================
        // Scanner berjalan di GitHub Pages.
        // Gunakan JSONP untuk memanggil Web App lintas domain.

        checkQRCodeViaJsonp(decodedText);


      })

      .catch(function(error) {


        scanning = false;


        document
          .getElementById("loading")
          .style.display = "none";


        showError(
          "SCANNER ERROR",
          error
        );

      });


  }


  // =====================================================
  // CEK QR KE GOOGLE APPS SCRIPT VIA JSONP
  // =====================================================

  function checkQRCodeViaJsonp(qrText) {

    const loading =
      document.getElementById("loading");

    const callbackName =
      "qrCallback_" +
      Date.now() +
      "_" +
      Math.floor(Math.random() * 100000);

    let finished = false;

    function cleanup() {

      if (jsonpScript && jsonpScript.parentNode) {
        jsonpScript.parentNode.removeChild(jsonpScript);
      }

      jsonpScript = null;

      try {
        delete window[callbackName];
      } catch (e) {
        window[callbackName] = undefined;
      }

    }

    function finishWithError(title, message) {

      if (finished) {
        return;
      }

      finished = true;

      cleanup();

      loading.style.display = "none";

      showError(
        title,
        message
      );

    }

    window[callbackName] = function(data) {

      if (finished) {
        return;
      }

      finished = true;

      cleanup();

      loading.style.display = "none";

      if (!data || typeof data !== "object") {

        showError(
          "RESPON TIDAK VALID",
          "Google Apps Script mengirim respons yang tidak dapat dibaca."
        );

        return;
      }

      showResult(data);

    };

    jsonpScript =
      document.createElement("script");

    jsonpScript.async = true;

    jsonpScript.src =
      GOOGLE_SCRIPT_URL +
      "?action=check" +
      "&qr=" +
      encodeURIComponent(qrText) +
      "&callback=" +
      encodeURIComponent(callbackName) +
      "&_=" +
      Date.now();

    jsonpScript.onerror = function() {

      finishWithError(
        "GAGAL TERHUBUNG",
        "Google Apps Script tidak dapat diakses. " +
        "Pastikan deployment Web App aktif, versi terbaru sudah diterapkan, " +
        'dan aksesnya disetel ke "Siapa saja".'
      );

    };

    document.body.appendChild(jsonpScript);

    setTimeout(function() {

      if (!finished) {

        finishWithError(
          "GAGAL TERHUBUNG",
          "Google Apps Script tidak memberikan respons. " +
          "Periksa URL Web App, deployment, dan koneksi internet."
        );

      }

    }, 15000);

  }


  // =====================================================
  // TAMPILKAN HASIL
  // =====================================================

  function showResult(
    data
  ) {


    const result =
      document.getElementById(
        "result"
      );


    const icon =
      document.getElementById(
        "resultIcon"
      );


    const title =
      document.getElementById(
        "resultTitle"
      );


    const name =
      document.getElementById(
        "resultName"
      );


    const info =
      document.getElementById(
        "resultInfo"
      );


    const code =
      document.getElementById(
        "resultCode"
      );


    result.style.display =
      "block";


    // =================================================
    // HADIR
    // =================================================

    if (
      data.status ===
      "HADIR"
    ) {


      result.className =
        "result success";


      icon.innerHTML =
        "✅";


      title.innerHTML =
        "CHECK-IN BERHASIL";


      name.innerHTML =
        data.nama;


      info.innerHTML =
        data.jabatan +
        "<br>" +
        data.waktu;


      code.innerHTML =
        "Kode Peserta: " +
        data.kode;


    }


    // =================================================
    // SUDAH HADIR
    // =================================================

    else if (
      data.status ===
      "SUDAH_HADIR"
    ) {


      result.className =
        "result warning";


      icon.innerHTML =
        "⚠️";


      title.innerHTML =
        "SUDAH CHECK-IN";


      name.innerHTML =
        data.nama;


      info.innerHTML =
        data.jabatan +
        "<br>" +
        "Check-in: " +
        data.waktu;


      code.innerHTML =
        "Kode Peserta: " +
        data.kode;


    }


    // =================================================
    // ERROR
    // =================================================

    else {


      showError(

        "QR TIDAK VALID",

        data.pesan

      );


      return;

    }


    // =================================================
    // TOMBOL SCAN BERIKUTNYA
    // =================================================

    document
      .getElementById("scanAgain")
      .style.display = "block";


  }


  // =====================================================
  // ERROR
  // =====================================================

  function showError(
    titleText,
    messageText
  ) {


    const result =
      document.getElementById(
        "result"
      );


    const icon =
      document.getElementById(
        "resultIcon"
      );


    const title =
      document.getElementById(
        "resultTitle"
      );


    const name =
      document.getElementById(
        "resultName"
      );


    const info =
      document.getElementById(
        "resultInfo"
      );


    const code =
      document.getElementById(
        "resultCode"
      );


    result.className =
      "result error";


    result.style.display =
      "block";


    icon.innerHTML =
      "❌";


    title.innerHTML =
      titleText;


    name.innerHTML =
      "";


    info.innerHTML =
      messageText;


    code.innerHTML =
      "";


    document
      .getElementById("scanAgain")
      .style.display = "block";


  }


  // =====================================================
  // SCAN PESERTA BERIKUTNYA
  // =====================================================

  function scanAgain() {


    document
      .getElementById("result")
      .style.display = "none";


    document
      .getElementById("scanAgain")
      .style.display = "none";


    document
      .getElementById("reader")
      .style.display = "none";


    startScanner();


  }


</script>


</body>

</html>
