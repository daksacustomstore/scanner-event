<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <meta name="theme-color" content="#f3f4f6">
  <title>Check-in Event</title>

  <!-- QR SCANNER -->
  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 18px;
      background: #f3f4f6;
      font-family: Arial, Helvetica, sans-serif;
      color: #111827;
    }

    .container {
      width: 100%;
      max-width: 660px;
      margin: 0 auto;
    }

    .header {
      text-align: center;
      margin: 18px 0 24px;
    }

    .header h1 {
      margin: 0 0 10px;
      font-size: clamp(30px, 7vw, 48px);
      font-weight: 800;
      letter-spacing: -1px;
    }

    .header p {
      margin: 0;
      color: #667085;
      font-size: clamp(18px, 4vw, 24px);
    }

    button {
      width: 100%;
      border: 0;
      border-radius: 16px;
      padding: 20px 16px;
      font-size: clamp(18px, 4vw, 25px);
      font-weight: 800;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    button:active {
      transform: scale(.985);
    }

    #startButton {
      background: #1a73e8;
      color: #fff;
      box-shadow: 0 7px 18px rgba(0,0,0,.12);
    }

    #reader {
      display: none;
      width: 100%;
      margin-top: 18px;
      padding: 8px;
      background: #000;
      border-radius: 18px;
      overflow: hidden;
    }

    #reader video {
      width: 100% !important;
      height: auto !important;
      border-radius: 12px;
    }

    .loading {
      display: none;
      margin-top: 18px;
      padding: 16px;
      text-align: center;
      color: #667085;
      font-size: 16px;
    }

    .result {
      display: none;
      margin-top: 18px;
      padding: 28px 20px;
      background: #fff;
      border-radius: 18px;
      text-align: center;
      box-shadow: 0 5px 18px rgba(0,0,0,.08);
    }

    .result.success {
      border-top: 8px solid #16803c;
    }

    .result.warning {
      border-top: 8px solid #d88900;
    }

    .result.error {
      border-top: 8px solid #d93025;
    }

    .result-icon {
      font-size: 64px;
      line-height: 1;
      margin-bottom: 16px;
    }

    .result-title {
      font-size: clamp(26px, 6vw, 40px);
      font-weight: 800;
      margin-bottom: 14px;
    }

    .success .result-title { color: #16803c; }
    .warning .result-title { color: #b26a00; }
    .error .result-title { color: #d93025; }

    .result-name {
      font-size: clamp(22px, 5vw, 32px);
      font-weight: 800;
      margin: 12px 0;
    }

    .result-info {
      font-size: clamp(16px, 4vw, 21px);
      line-height: 1.6;
      color: #475467;
    }

    .result-code {
      margin-top: 14px;
      font-size: clamp(16px, 4vw, 20px);
      font-weight: 800;
    }

    #scanAgain {
      display: none;
      margin-top: 16px;
      background: #111827;
      color: #fff;
    }

    .info {
      margin-top: 18px;
      padding: 15px;
      background: #fff;
      border-radius: 14px;
      text-align: center;
      color: #667085;
      font-size: 14px;
      line-height: 1.5;
    }

    .small-note {
      font-size: 13px;
      color: #98a2b3;
      margin-top: 10px;
      text-align: center;
    }
  </style>
</head>

<body>
  <main class="container">

    <header class="header">
      <h1>CHECK-IN EVENT</h1>
      <p>Scan QR Code Peserta</p>
    </header>

    <button id="startButton" type="button" onclick="startScanner()">
      📷 MULAI SCANNER
    </button>

    <div id="loading" class="loading">
      Meminta izin kamera...
    </div>

    <div id="reader"></div>

    <section id="result" class="result" aria-live="polite">
      <div id="resultIcon" class="result-icon"></div>
      <div id="resultTitle" class="result-title"></div>
      <div id="resultName" class="result-name"></div>
      <div id="resultInfo" class="result-info"></div>
      <div id="resultCode" class="result-code"></div>
    </section>

    <button id="scanAgain" type="button" onclick="scanAgain()">
      📷 SCAN PESERTA BERIKUTNYA
    </button>

    <div id="info" class="info">
      Tekan tombol <b>MULAI SCANNER</b> untuk mengaktifkan kamera.
      <div class="small-note">
        Scanner berjalan di GitHub Pages. Google Apps Script hanya digunakan sebagai server/database check-in.
      </div>
    </div>

  </main>

  <script>
    // =========================================================
    // KONFIGURASI
    // =========================================================

    const GOOGLE_SCRIPT_URL =
      'https://script.google.com/macros/s/AKfycbwpZRPTpi74hlQP48SqOEs1mScsH_C_5njMGSGTXJttEcOYxPN_8FkHnC700sWkC-eM/exec';


    // =========================================================
    // GLOBAL
    // =========================================================

    let scanner = null;
    let scanning = false;
    let processing = false;


    // =========================================================
    // UTILITAS
    // =========================================================

    function $(id) {
      return document.getElementById(id);
    }

    function escapeHtml(value) {
      return String(value == null ? "" : value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }


    // =========================================================
    // BEEP
    // =========================================================

    function beep() {
      try {
        const AudioContext =
          window.AudioContext || window.webkitAudioContext;

        if (!AudioContext) return;

        const audioContext = new AudioContext();
        const oscillator = audioContext.createOscillator();
        const gainNode = audioContext.createGain();

        oscillator.type = "sine";
        oscillator.frequency.value = 1000;
        gainNode.gain.value = 0.15;

        oscillator.connect(gainNode);
        gainNode.connect(audioContext.destination);

        oscillator.start();
        oscillator.stop(audioContext.currentTime + 0.15);
      } catch (error) {
        console.log("Beep tidak tersedia:", error);
      }
    }


    // =========================================================
    // PERMINTAAN IZIN KAMERA
    // =========================================================

    async function requestCameraPermission() {
      if (!window.isSecureContext) {
        throw new Error(
          "Halaman scanner harus dibuka melalui HTTPS. Gunakan GitHub Pages."
        );
      }

      if (
        !navigator.mediaDevices ||
        !navigator.mediaDevices.getUserMedia
      ) {
        throw new Error(
          "Browser tidak mendukung akses kamera."
        );
      }

      // Penting:
      // getUserMedia dipanggil langsung setelah tombol ditekan.
      // Ini membuat permintaan kamera berasal dari interaksi pengguna.
      const stream =
        await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: { ideal: "environment" }
          },
          audio: false
        });

      // Stream hanya dipakai untuk memastikan izin kamera.
      // Html5Qrcode akan membuka kamera untuk proses scanning.
      stream.getTracks().forEach(function(track) {
        track.stop();
      });

      await new Promise(function(resolve) {
        setTimeout(resolve, 250);
      });
    }


    // =========================================================
    // PILIH KAMERA
    // =========================================================

    async function getBestCameraId() {
      const cameras = await Html5Qrcode.getCameras();

      if (!cameras || cameras.length === 0) {
        throw new Error(
          "Kamera tidak ditemukan pada perangkat ini."
        );
      }

      const keywords = [
        "back",
        "rear",
        "environment",
        "belakang"
      ];

      for (let i = 0; i < cameras.length; i++) {
        const label =
          String(cameras[i].label || "").toLowerCase();

        for (let j = 0; j < keywords.length; j++) {
          if (label.includes(keywords[j])) {
            return cameras[i].id;
          }
        }
      }

      return cameras[0].id;
    }


    // =========================================================
    // MULAI SCANNER
    // =========================================================

    async function startScanner() {
      if (scanning) return;

      processing = false;

      $("result").style.display = "none";
      $("scanAgain").style.display = "none";
      $("startButton").style.display = "none";
      $("info").style.display = "none";
      $("reader").style.display = "block";
      $("loading").style.display = "block";
      $("loading").innerHTML = "Meminta izin kamera...";

      try {
        // -----------------------------------------------------
        // 1. MINTA IZIN KAMERA DARI INTERAKSI TOMBOL
        // -----------------------------------------------------

        await requestCameraPermission();

        $("loading").innerHTML = "Membuka kamera...";

        // -----------------------------------------------------
        // 2. BERSIHKAN SCANNER LAMA
        // -----------------------------------------------------

        if (scanner) {
          try {
            await scanner.clear();
          } catch (error) {
            console.log("Scanner lama sudah tidak aktif.");
          }

          scanner = null;
        }

        // -----------------------------------------------------
        // 3. BUAT INSTANCE BARU
        // -----------------------------------------------------

        scanner = new Html5Qrcode("reader");

        // -----------------------------------------------------
        // 4. PILIH KAMERA BELAKANG
        // -----------------------------------------------------

        const cameraId = await getBestCameraId();

        // -----------------------------------------------------
        // 5. START
        // -----------------------------------------------------

        await scanner.start(
          cameraId,
          {
            fps: 10,
            qrbox: function(viewfinderWidth, viewfinderHeight) {
              const size = Math.floor(
                Math.min(viewfinderWidth, viewfinderHeight) * 0.65
              );

              const safeSize = Math.max(
                180,
                Math.min(size, 320)
              );

              return {
                width: safeSize,
                height: safeSize
              };
            },
            aspectRatio: 1.0
          },
          onScanSuccess,
          function(errorMessage) {
            // Error pembacaan frame biasa tidak ditampilkan.
          }
        );

        scanning = true;
        $("loading").style.display = "none";

      } catch (error) {
        console.error("Gagal membuka kamera:", error);

        scanning = false;
        $("loading").style.display = "none";
        $("reader").style.display = "none";
        $("startButton").style.display = "block";
        $("info").style.display = "block";

        const message =
          String(
            error && error.message
              ? error.message
              : error
          );

        let userMessage = message;

        if (
          /notallowed|permission|denied/i.test(message)
        ) {
          userMessage =
            "Akses kamera ditolak atau tidak tersedia.<br><br>" +
            "Pastikan izin kamera untuk <b>GitHub Pages</b> sudah diizinkan di Chrome. " +
            "Kemudian tekan <b>MULAI SCANNER</b> lagi.";
        }

        if (
          /security|secure context|https/i.test(message)
        ) {
          userMessage =
            "Scanner harus dibuka melalui HTTPS. " +
            "Buka scanner dari alamat GitHub Pages, bukan dari URL Google Apps Script.";
        }

        showError(
          "KAMERA TIDAK DAPAT DIBUKA",
          userMessage +
          "<br><br><small>" +
          escapeHtml(message) +
          "</small>"
        );
      }
    }


    // =========================================================
    // QR BERHASIL DIBACA
    // =========================================================

    async function onScanSuccess(decodedText) {
      if (!scanning || processing) return;

      processing = true;
      beep();

      try {
        if (scanner) {
          await scanner.stop();
        }
      } catch (error) {
        console.log("Kamera sudah berhenti:", error);
      }

      scanning = false;

      $("reader").style.display = "none";
      $("loading").style.display = "block";
      $("loading").innerHTML = "Memeriksa peserta...";

      checkQRCodeFromServer(decodedText)
        .then(function(data) {
          $("loading").style.display = "none";
          showResult(data);
        })
        .catch(function(error) {
          $("loading").style.display = "none";

          showError(
            "GAGAL TERHUBUNG",
            "Tidak dapat menghubungi server. Periksa koneksi internet.<br><br>" +
            "<small>" +
            escapeHtml(String(error)) +
            "</small>"
          );
        });
    }


    // =========================================================
    // HUBUNGI GOOGLE APPS SCRIPT
    // JSONP
    // =========================================================

    function checkQRCodeFromServer(qrText) {
      return new Promise(function(resolve, reject) {

        const callbackName =
          "qrCallback_" +
          Date.now() +
          "_" +
          Math.floor(Math.random() * 100000);

        const script =
          document.createElement("script");

        let finished = false;

        const timeout =
          setTimeout(function() {
            if (finished) return;

            finished = true;
            cleanup();

            reject(
              new Error(
                "Server tidak memberikan respons dalam waktu 15 detik."
              )
            );
          }, 15000);


        function cleanup() {
          clearTimeout(timeout);

          try {
            delete window[callbackName];
          } catch (error) {
            window[callbackName] = undefined;
          }

          if (script.parentNode) {
            script.parentNode.removeChild(script);
          }
        }


        window[callbackName] =
          function(data) {
            if (finished) return;

            finished = true;
            cleanup();
            resolve(data);
          };


        script.onerror =
          function() {
            if (finished) return;

            finished = true;
            cleanup();

            reject(
              new Error(
                "Gagal mengakses Google Apps Script."
              )
            );
          };


        script.src =
          GOOGLE_SCRIPT_URL +
          "?action=check" +
          "&qr=" +
          encodeURIComponent(qrText) +
          "&callback=" +
          encodeURIComponent(callbackName) +
          "&_=" +
          Date.now();

        document.body.appendChild(script);
      });
    }


    // =========================================================
    // TAMPILKAN HASIL
    // =========================================================

    function showResult(data) {
      const result = $("result");

      result.style.display = "block";

      if (data && data.status === "HADIR") {

        result.className = "result success";

        $("resultIcon").innerHTML = "✅";
        $("resultTitle").innerHTML = "CHECK-IN BERHASIL";
        $("resultName").innerHTML =
          escapeHtml(data.nama || "");

        $("resultInfo").innerHTML =
          escapeHtml(data.jabatan || "") +
          "<br>" +
          escapeHtml(data.waktu || "");

        $("resultCode").innerHTML =
          "Kode Peserta: " +
          escapeHtml(data.kode || "");
      }

      else if (
        data &&
        data.status === "SUDAH_HADIR"
      ) {

        result.className = "result warning";

        $("resultIcon").innerHTML = "⚠️";
        $("resultTitle").innerHTML = "SUDAH CHECK-IN";

        $("resultName").innerHTML =
          escapeHtml(data.nama || "");

        $("resultInfo").innerHTML =
          escapeHtml(data.jabatan || "") +
          "<br>Check-in: " +
          escapeHtml(data.waktu || "");

        $("resultCode").innerHTML =
          "Kode Peserta: " +
          escapeHtml(data.kode || "");
      }

      else {

        showError(
          "QR TIDAK VALID",
          escapeHtml(
            data && data.pesan
              ? data.pesan
              : "QR Code tidak valid."
          )
        );

        return;
      }

      $("scanAgain").style.display = "block";
      $("info").style.display = "none";
    }


    // =========================================================
    // ERROR
    // =========================================================

    function showError(titleText, messageText) {
      const result = $("result");

      result.className = "result error";
      result.style.display = "block";

      $("resultIcon").innerHTML = "❌";
      $("resultTitle").innerHTML = titleText;
      $("resultName").innerHTML = "";
      $("resultInfo").innerHTML = messageText;
      $("resultCode").innerHTML = "";

      $("scanAgain").style.display = "block";
    }


    // =========================================================
    // SCAN BERIKUTNYA
    // =========================================================

    function scanAgain() {
      $("result").style.display = "none";
      $("scanAgain").style.display = "none";
      $("info").style.display = "none";

      startScanner();
    }
  </script>
</body>
</html>
